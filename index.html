<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Chấm Điểm Phát Âm Tiếng Trung</title>
    <style>
        :root {
            --primary-color: #de2910; /* Màu đỏ cờ Trung Quốc */
            --secondary-color: #ffde00; /* Màu vàng */
            --bg-color: #fff8f7;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(222, 41, 16, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 26px;
        }

        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .vocab-box {
            background-color: #fdfefe;
            padding: 25px;
            border-radius: 16px;
            border: 2px solid #fadbd8;
            margin-bottom: 20px;
        }

        .word-target {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
        }

        .word-pinyin {
            font-size: 20px;
            color: var(--primary-color);
            font-weight: 500;
            margin: 5px 0 10px 0;
        }

        .word-meaning {
            font-size: 16px;
            color: #7f8c8d;
            margin: 0 0 20px 0;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-audio {
            background-color: #2980b9;
            margin-bottom: 10px;
        }

        .btn-mic {
            background-color: var(--primary-color);
            width: 100%;
            margin: 15px 0;
            padding: 15px;
            font-size: 18px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(222, 41, 16, 0.3);
        }
        
        .btn-mic.recording {
            animation: pulse 1.5s infinite;
            background-color: #f39c12;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            display: none;
        }

        .score {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .transcript {
            font-size: 16px;
        }

        .success { background-color: #e8f8f5; color: #117a65; border: 1px solid #a3e4d7; }
        .warning { background-color: #fef9e7; color: #b57914; border: 1px solid #f9e79f; }
        .danger { background-color: #f9ebea; color: #922b21; border: 1px solid #f2d4d7; }
    </style>
</head>
<body>

<div class="container">
    <h1>Học Phát Âm Tiếng Trung</h1>
    <p class="subtitle">Giọng Phổ Thông Chuẩn Giản Thể (Putonghua)</p>

    <div class="vocab-box">
        <p class="word-target" id="wordTarget">你好</p>
        <p class="word-pinyin" id="wordPinyin">nǐ hǎo</p>
        <p class="word-meaning" id="wordMeaning">Xin chào</p>
        
        <button class="btn-audio" onclick="playStandardAudio()">🔊 Nghe phát âm mẫu</button>
        
        <div class="nav-buttons">
            <button id="btnPrev" onclick="changeWord(-1)">◀ Từ trước</button>
            <button id="btnNext" onclick="changeWord(1)">Từ sau ▶</button>
        </div>
    </div>

    <button id="btnMic" class="btn-mic" onclick="toggleRecognition()">🎤 Nhấn để đọc</button>

    <div id="resultBox" class="result-box">
        <div class="score" id="scoreText">0%</div>
        <div class="transcript" id="transcriptText">Hệ thống nghe được: ...</div>
    </div>
</div>

<script>
    // Danh sách từ vựng tiếng Trung giao tiếp đơn giản kèm Pinyin
    const chineseVocab = [
        { word: "你好", pinyin: "nǐ hǎo", meaning: "Xin chào" },
        { word: "谢谢", pinyin: "xièxie", meaning: "Cảm ơn" },
        { word: "再见", pinyin: "zàijiàn", meaning: "Tạm biệt" },
        { word: "老师", pinyin: "lǎoshī", meaning: "Thầy cô giáo" },
        { word: "学生", pinyin: "xuésheng", meaning: "Học sinh" },
        { word: "中国", pinyin: "Zhōngguó", meaning: "Trung Quốc" },
        { word: "喜欢", pinyin: "xǐhuan", meaning: "Thích" },
        { word: "喝水", pinyin: "hē shuǐ", meaning: "Uống nước" },
        { word: "吃饭", pinyin: "chī fàn", meaning: "Ăn cơm" },
        { word: "高兴", pinyin: "gāoxìng", meaning: "Vui vẻ" }
    ];

    let currentIndex = 0;
    let recognition;
    let isRecording = false;

    // Khởi tạo hiển thị từ đầu tiên
    updateWordDisplay();

    // Thiết lập Web Speech API nhận diện tiếng Trung
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        
        // Đặt ngôn ngữ là Tiếng Trung Phổ Thông Đại Lục (zh-CN)
        recognition.lang = 'zh-CN'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
            isRecording = true;
            const btnMic = document.getElementById('btnMic');
            btnMic.textContent = "🛑 Đang lắng nghe... Hãy nói!";
            btnMic.classList.add('recording');
            document.getElementById('resultBox').style.display = 'none';
        };

        recognition.onresult = (event) => {
            const resultText = event.results[0][0].transcript;
            const confidence = event.results[0][0].confidence; // Độ chính xác ước tính từ Google
            
            evaluatePronunciation(resultText, confidence);
        };

        recognition.onend = () => {
            isRecording = false;
            const btnMic = document.getElementById('btnMic');
            btnMic.textContent = "🎤 Nhấn để đọc";
            btnMic.classList.remove('recording');
        };

        recognition.onerror = (event) => {
            console.error(event.error);
            alert("Lỗi nhận diện. Bạn hãy chắc chắn đã cấp quyền Micro cho trình duyệt nhé!");
        };
    } else {
        alert("Trình duyệt này không hỗ trợ Web Speech API. Vui lòng chạy ứng dụng trên Google Chrome.");
    }

    // Hàm cập nhật từ vựng lên giao diện
    function updateWordDisplay() {
        document.getElementById('wordTarget').textContent = chineseVocab[currentIndex].word;
        document.getElementById('wordPinyin').textContent = chineseVocab[currentIndex].pinyin;
        document.getElementById('wordMeaning').textContent = chineseVocab[currentIndex].meaning;
        document.getElementById('resultBox').style.display = 'none';
        
        document.getElementById('btnPrev').disabled = currentIndex === 0;
        document.getElementById('btnNext').disabled = currentIndex === chineseVocab.length - 1;
    }

    function changeWord(direction) {
        currentIndex += direction;
        if (currentIndex >= 0 && currentIndex < chineseVocab.length) {
            updateWordDisplay();
        }
    }

    // Hàm đọc mẫu (Sử dụng Text-to-Speech giọng zh-CN)
    function playStandardAudio() {
        const targetWord = chineseVocab[currentIndex].word;
        const utterance = new SpeechSynthesisUtterance(targetWord);
        utterance.lang = 'zh-CN'; 
        window.speechSynthesis.speak(utterance);
    }

    function toggleRecognition() {
        if (isRecording) {
            recognition.stop();
        } else {
            recognition.start();
        }
    }

    // Thuật toán so sánh chữ Hán và chấm điểm
    function evaluatePronunciation(spokenText, googleConfidence) {
        // Loại bỏ dấu câu nếu có để so sánh chính xác chữ Hán
        const targetWord = chineseVocab[currentIndex].word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"").trim();
        const processedSpoken = spokenText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"").trim();

        const resultBox = document.getElementById('resultBox');
        const scoreText = document.getElementById('scoreText');
        const transcriptText = document.getElementById('transcriptText');

        transcriptText.textContent = `Bạn đã đọc: "${spokenText}"`;
        resultBox.style.display = 'block';

        // 1. Nếu khớp chính xác chữ Hán mục tiêu
        if (processedSpoken === targetWord) {
            let finalScore = Math.round(googleConfidence * 100);
            if (finalScore < 85) finalScore = 90; // Bù điểm sàn cho học sinh khi nhận diện đúng từ

            scoreText.textContent = `太棒/Tuyệt vời! ${finalScore}%`;
            resultBox.className = "result-box success";
        } 
        // 2. Nếu trong câu học sinh đọc có chứa từ mục tiêu
        else if (processedSpoken.includes(targetWord)) {
            scoreText.textContent = `很好/Rất tốt! 75%`;
            resultBox.className = "result-box warning";
        } 
        // 3. Nếu hệ thống nhận diện ra từ hoàn toàn khác (sai âm hoặc sai thanh điệu)
        else {
            scoreText.textContent = `不对/Chưa đúng! 30%`;
            resultBox.className = "result-box danger";
        }
    }
</script>

</body>
</html>
